# IMPORTANT: "name" becomes part of the URL (https://<name>.<your-subdomain>.workers.dev).
# Push subscriptions are tied to that URL, so settle on the name before anyone installs the app.
name = "harshontime"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "harshontime"
database_id = "61712eb8-5e3f-4e72-a72f-42d847831b4b"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
# Public half of the VAPID pair (safe to expose). Filled in from `npm run vapid`.
VAPID_PUBLIC_KEY = "BCkTGh1igZ0XcpYqTFB3bOoHZI57e7aoimC2gPHT1UMFjct_9p7CkjBCqF58qcCoJvO5I9T-JQFQ2hhaV5WEOJo"
# Apple rejects malformed subjects. Use a real address in exactly this form.
VAPID_SUBJECT = "mailto:allmygtrash@gmail.com"

# Secrets (set with `wrangler secret put`, never committed):
#   VAPID_PRIVATE_JWK  - private half of the VAPID pair, as JSON
#   SPIKE_KEY          - passphrase the nine of you type once to use the spike (Phase 0 only; can be deleted)
#   CREATE_GROUP_ANSWERS - comma-separated answers to the "are you Shri?" question that gates group creation
